<!DOCTYPE html>

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Quiz App</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="screen active" id="strt-pg">
                <h1>Quiz Time!</h1>
                <p>Test Your Knowledge with these fun questions</p>
                <button id="strt-btn">Start Quiz</button>
            </div>

            <div class="screen" id="question-pg">
                <h2 id="question-text">Question</h2>
                <div class="ques-info">
                <p>
                    Queston <span id="question-no">0</span> of <span id="total-ques">5</span>
                </p>
                <p>
                    Score:<span id="score">0</span>
                </p>
                </div>
                <div class="question-options">
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                </div>
                <div class="progress-bar">
                    <div class="progres" id="progress"></div>
                </div>
                <button class="next" id="next-ques"> Next </button>
            </div>

            <div class="screen" id="end-pg">
                <h1>Quiz Result</h1> 
                <div class="final">
                <p>
                    You Score <span id="final-score">0</span> out of <span id="max-score">0</span>
                </p>
                <p id="orng"><span id="final-text">text</span></p>
                </div>

                <button id="restrt-btn">Restart Quiz</button>
            </div>


        </div>
    
        <script src="index.js" async defer></script>
    </body>
</html>
