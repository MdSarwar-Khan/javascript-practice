<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>TO-DO Web App</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section class="head">
            <h1>TO-DO APP</h1>
        </section>
        <section class="status-bar">
            <button class="today">Today</button>
            <button class="pending">Pending</button>
            <button class="overdue">Overdue</button>
        </section>
        <div class="in">
            <h2>Tasks</h2>


            <button id="addbtn">+ Add Task</button>
        </div>

        <div class="addtask" hidden>
            <h3>Add a New Task</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="task_name">Task Name</label>
                    <input 
                    id="task_name"
                    type="text"
                    placeholder="Enter your task..."
                     />
                </div>

                <div class="form-group">
                    <label for="tdate">Task Completion Date</label>
                    <input
                    id="tdate"
                    type="date"
                    />
                </div>

            </div>
            <button id="submit">+ Add Task</button>
        </div>

            
        <section class="io">
            <div class="listheader">
            <span class="num">#</span>
            <span class="check">done</span>
            <span class="task">Tasks</span>
            <span class="status">pending</span>
            <span class="create">creation</span>
            <span class="complete">completion</span>
            </div>

            <ul id="tasklist"></ul>
        </section>
        <script src="script.js" async defer></script>
    </body>
</html>
